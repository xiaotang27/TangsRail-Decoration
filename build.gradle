    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'top.xiaotang27.trdm.tools.SamplePackGenerator'
    doFirst {
        args = [(project.findProperty('out') ?: 'build/sample-pack/trdm-pis-sample').toString()]
    }
}

// 一次性工具：量 PIS 背景图里欢迎语的居中位置（左栏文字的竖中对齐用）。
tasks.register('measurePisBackground', JavaExec) {
    group = 'trdm'
    description = 'Measures the horizontal centre of the welcome text in tjpids.png'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'top.xiaotang27.trdm.tools.PisMeasure'
}

// 一次性工具：把 JCM（TJPIS 资源包）里的 PIS 贴图搬进本 mod 的资源目录
// （用户决定「模型和贴图先使用 jcm 的」）。只在需要重新导入时手动跑。
tasks.register('importJcmAssets', Copy) {
    group = 'trdm'
    description = 'Imports the JCM PIS textures into src/main/resources/assets/trdm/textures/block/pis'
    from jcmPisTextures
    include 'tjpids.png', 'tc.png', 'zj.png', '0tc.png', 'adsdef.png'
    into 'src/main/resources/assets/trdm/textures/block/pis'
}

// 一次性工具：把用户提供的思源黑体（Source Han Sans HW SC VF）打进 jar，
// PIS / 站名牌的中文都用它（AWT 从 jar 里的 ttf 加载，不依赖系统装没装）。
// 注意：资源路径只能是小写，所以统一存成 sourcehansanshwsc-vf.ttf。
tasks.register('importPisFont') {
    group = 'trdm'
    description = 'Copies SourceHanSansHWSC-VF.ttf into src/main/resources/assets/trdm/font'
    doLast {
        def source = pisFontSource
        def targetDir = file('src/main/resources/assets/trdm/font')
        targetDir.mkdirs()
        java.nio.file.Files.copy(source.toPath(),
                new File(targetDir, 'sourcehansanshwsc-vf.ttf').toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        new File(targetDir, 'SourceHanSansHWSC-VF.ttf').delete()
        println "font -> " + new File(targetDir, 'sourcehansanshwsc-vf.ttf').length() + " bytes"
    }
}

// 一次性工具：列出某个 jar 里的 class 引用了哪些成员（核对第三方 mod 的真实字节码）。
tasks.register('classRefs', JavaExec) {
    group = 'trdm'
    description = 'Lists member references of a class inside a jar (-Pjar= -Pentry= -Pfilter=)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'top.xiaotang27.trdm.tools.ClassRefs'
    doFirst {
        args = [(project.findProperty('jar') ?: '').toString(),
                (project.findProperty('entry') ?: '').toString(),
                (project.findProperty('filter') ?: '').toString(),
                (project.findProperty('mode') ?: '').toString()]
    }
}

