# ===== 公共构建配置 =====
# 本机专属的东西（构建 JVM、依赖 jar 的相对/绝对路径、代理、本地素材位置）不写在这里：
#   - 依赖 jar / 本地素材 → local.properties（见 local.properties.example）
#   - 构建 JVM / 代理     → 用户级 ~/.gradle/gradle.properties，或直接设 JAVA_HOME
# 这样别人 clone 下来不会撞上你的绝对路径。

# 注意：org.gradle.jvmargs 必须写在一行里（反斜杠续行会被截断，只剩第一个参数生效）。
org.gradle.jvmargs=-Xmx2G

# 国内网络调优（不含代理地址本身，代理请放用户级配置）。
systemProp.java.net.preferIPv4Stack=true
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=300000

org.gradle.parallel=true
# loom 已知 issue #1349 的官方示例做法：关掉 configuration cache。
org.gradle.configuration-cache=false

# loom 换源（0.10 起内置）：Minecraft libraries / assets / 版本清单走 BMCLAPI。
# Fabric 自己的 maven（fabric-loader / fabric-api / fabric-loom）没有可用的国内公共镜像，
# 保持官方源，靠上面的长超时 + 重试（Gradle 会缓存已下载的 artifact）。
loom_libraries_base=https://bmclapi2.bangbang93.com/maven/
loom_resources_base=https://bmclapi2.bangbang93.com/assets/
loom_version_manifests=https://bmclapi2.bangbang93.com/mc/game/version_manifest.json

minecraft_version=1.20.1
loader_version=0.19.3
loom_version=1.17.19
fabric_api_version=0.92.11+1.20.1

version=DEV_0.2
group=top.xiaotang27.trdm
